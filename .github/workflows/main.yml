name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Jarvis.zip
      run: unzip -o Jarvis.zip

    - name: Auto-Fix Missing Imports & Dependencies
      working-directory: ./Jarvis
      run: |
        # 1. JarvisInCallService.kt में CallAudioState इम्पोर्ट जोड़ना
        sed -i '/package com.jarvis.app/a import android.telecom.CallAudioState' app/src/main/java/com/jarvis/app/JarvisInCallService.kt

        # 2. build.gradle.kts में पुराने security-crypto को हटाकर 1.1.0-alpha06 लगाना
        sed -i '/security-crypto/d' app/build.gradle.kts
        sed -i '/dependencies {/a \    implementation("androidx.security:security-crypto:1.1.0-alpha06")' app/build.gradle.kts

        # 3. SecurePrefs.kt में MasterKey इम्पोर्ट सुनिश्चित करना
        if ! grep -q "import androidx.security.crypto.MasterKey" app/src/main/java/com/jarvis/app/SecurePrefs.kt; then
          sed -i '/package com.jarvis.app/a import androidx.security.crypto.MasterKey' app/src/main/java/com/jarvis/app/SecurePrefs.kt
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      working-directory: ./Jarvis
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: Jarvis/app/build/outputs/apk/debug/*.apk
